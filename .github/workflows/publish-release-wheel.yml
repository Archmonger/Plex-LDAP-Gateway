name: Publish Release Distributions

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
  distributions:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"

            - name: Install Hatch
              run: python -m pip install --upgrade pip hatch

            - name: Build distributions with Hatch
              run: hatch build

            - name: Upload wheel and sdist to GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz --clobber
