name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUID: "1000"
  PGID: "1000"
  TZ: UTC

jobs:
  lint:
    name: lint / format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch

      - name: Run hatch fmt --check
        run: hatch fmt --check

  tests:
    name: tests / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch

      - name: Export Plex CI inputs
        shell: bash
        run: |
          {
            echo "PLEX_OWNER_TOKEN=${{ secrets.PLEX_OWNER_TOKEN }}"
            echo "PLEX_MACHINE_IDENTIFIER=${{ secrets.PLEX_MACHINE_IDENTIFIER }}"
            echo "PLEX_TEST_BIND_LOGIN=${{ secrets.PLEX_TEST_BIND_LOGIN }}"
            echo "PLEX_TEST_BIND_PASSWORD=${{ secrets.PLEX_TEST_BIND_PASSWORD }}"
            echo "PLEX_TEST_BIND_IDENTITY=${{ secrets.PLEX_TEST_BIND_IDENTITY }}"
            echo "PLEX_TEST_EXPECTED_USERNAME=${{ secrets.PLEX_TEST_EXPECTED_USERNAME }}"
            echo "PLEX_TEST_EXPECTED_EMAIL=${{ secrets.PLEX_TEST_EXPECTED_EMAIL }}"
          } >> "$GITHUB_ENV"

      - name: Run tests with coverage
        run: hatch test --cover

  docker-build:
    name: docker / build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag plex-ldap-gateway:ci .

  docker-compose:
    name: docker / compose
    runs-on: ubuntu-latest
    needs:
      - tests
      - docker-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export Plex CI inputs
        id: plex-inputs
        shell: bash
        run: |
          {
            echo "PLEX_OWNER_TOKEN=${{ secrets.PLEX_OWNER_TOKEN }}"
            echo "PLEX_MACHINE_IDENTIFIER=${{ secrets.PLEX_MACHINE_IDENTIFIER }}"
            echo "PLEX_TEST_BIND_LOGIN=${{ secrets.PLEX_TEST_BIND_LOGIN }}"
            echo "PLEX_TEST_BIND_PASSWORD=${{ secrets.PLEX_TEST_BIND_PASSWORD }}"
            echo "PLEX_TEST_BIND_IDENTITY=${{ secrets.PLEX_TEST_BIND_IDENTITY }}"
            echo "PLEX_TEST_EXPECTED_USERNAME=${{ secrets.PLEX_TEST_EXPECTED_USERNAME }}"
            echo "PLEX_TEST_EXPECTED_EMAIL=${{ secrets.PLEX_TEST_EXPECTED_EMAIL }}"
          } >> "$GITHUB_ENV"

          if [ -n "${{ secrets.PLEX_OWNER_TOKEN }}" ] && [ -n "${{ secrets.PLEX_MACHINE_IDENTIFIER }}" ] && [ -n "${{ secrets.PLEX_TEST_BIND_LOGIN }}" ] && [ -n "${{ secrets.PLEX_TEST_BIND_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and start compose stack
        if: steps.plex-inputs.outputs.available == 'true'
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Verify HTTP readiness
        if: steps.plex-inputs.outputs.available == 'true'
        run: curl --fail --silent http://127.0.0.1:8000/readyz

      - name: Verify LDAP port
        if: steps.plex-inputs.outputs.available == 'true'
        shell: python
        run: |
          import socket

          with socket.create_connection(("127.0.0.1", 1389), timeout=5):
              pass

      - name: Report skipped compose validation
        if: steps.plex-inputs.outputs.available != 'true'
        run: echo "Skipping compose validation because the required Plex secrets are not configured."

      - name: Print compose logs on failure
        if: failure() && steps.plex-inputs.outputs.available == 'true'
        run: docker compose logs --no-color

      - name: Tear down compose stack
        if: always() && steps.plex-inputs.outputs.available == 'true'
        run: docker compose down -v --remove-orphans
