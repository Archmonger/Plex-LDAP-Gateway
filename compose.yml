name: plex-ldap-gateway

services:
  ldap:
    build:
      context: .
      dockerfile: Dockerfile
    image: plex-ldap-gateway:local
    container_name: plex-ldap-gateway
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-UTC}
      PLEX_OWNER_TOKEN: ${PLEX_OWNER_TOKEN:?Set PLEX_OWNER_TOKEN in .env}
      PLEX_MACHINE_IDENTIFIER: ${PLEX_MACHINE_IDENTIFIER:?Set PLEX_MACHINE_IDENTIFIER in .env}
      PLEX_BASE_URL: ${PLEX_BASE_URL:-https://plex.tv}
      PLEX_CLIENT_PRODUCT: ${PLEX_CLIENT_PRODUCT:-Plex LDAP Gateway}
      PLEX_CLIENT_VERSION: ${PLEX_CLIENT_VERSION:-0.1.0}
      PLEX_TIMEOUT_SECONDS: ${PLEX_TIMEOUT_SECONDS:-10}
      GATEWAY_LDAP_STRICT_MACHINE_MATCH: ${GATEWAY_LDAP_STRICT_MACHINE_MATCH:-true}
      GATEWAY_LDAP_REFRESH_SECONDS: ${GATEWAY_LDAP_REFRESH_SECONDS:-300}
      GATEWAY_LDAP_BASE_DN: ${GATEWAY_LDAP_BASE_DN:-dc=plex,dc=ldap}
      GATEWAY_LDAP_HOST: 0.0.0.0
      GATEWAY_LDAP_PORT: ${GATEWAY_LDAP_PORT:-1389}
      GATEWAY_HTTP_HOST: 0.0.0.0
      GATEWAY_HTTP_PORT: ${GATEWAY_HTTP_PORT:-7576}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-error}
      GATEWAY_LOG_OUTPUT: ${GATEWAY_LOG_OUTPUT:-console}
      GATEWAY_LOG_FILE_PATH: ${GATEWAY_LOG_FILE_PATH:-/config/logs/plex-ldap-gateway.log}
      SERVICE_CRASH_MAX_ATTEMPTS: ${SERVICE_CRASH_MAX_ATTEMPTS:-5}
      SERVICE_CRASH_WINDOW_SECONDS: ${SERVICE_CRASH_WINDOW_SECONDS:-300}
      SERVICE_CRASH_BACKOFF_SECONDS: ${SERVICE_CRASH_BACKOFF_SECONDS:-10}
    ports:
      - "${GATEWAY_LDAP_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_LDAP_PORT:-1389}:${GATEWAY_LDAP_PORT:-1389}/tcp"
      - "${GATEWAY_HTTP_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_HTTP_PORT:-7576}:${GATEWAY_HTTP_PORT:-7576}/tcp"
    volumes:
      - plex-ldap-gateway-config:/config
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:$${GATEWAY_HTTP_PORT}/readyz || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: on-failure:5
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

volumes:
  plex-ldap-gateway-config:
